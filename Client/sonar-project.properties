# SonarQube analysis config for the Client. Read by the npm scanner, which runs from this
# folder (Client/), so all paths are relative to Client/. The dynamic values — projectKey /
# projectName / host.url / token and PR-or-branch decoration — are passed on the command line
# by the NUKE ClientSonarQube target.

sonar.sources=.
sonar.tests=src

sonar.test.inclusions=**/*.spec.js,**/*.spec.jsx,**/*.test.js,**/*.test.jsx,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**
sonar.coverage.exclusions=src/serviceWorker.ts,src/index.tsx

sonar.sourceEncoding=UTF-8
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json
