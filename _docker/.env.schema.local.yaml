envSchema:
  - name: PLUGINHOST_CLIENT_HOSTNAME
    label: PluginHost Client Hostname
    description: "Hostname (and port) where the PluginHost client is reachable from the browser."
    type: text
    required: true
    default: localhost:5000

  # ---------------------------------------------------------------------------
  # Local-optimized schema (packaged as the "-local" variant).
  # Ports are published on the host; sensible localhost defaults keep local
  # deployment low-friction. Secrets still have no default and are masked.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Common
  # ---------------------------------------------------------------------------
  - name: IMAGE_BASE_PATH
    label: Image Registry Base Path
    description: "Base path of the container registry from which all Gaeco service images are pulled."
    type: text
    required: true
    default: ghcr.io/gaeco-ekkodale

  # ---------------------------------------------------------------------------
  # Host Port Bindings (local only)
  # ---------------------------------------------------------------------------
  - name: PLUGINHOST_POSTGRES_OUTERPORT
    label: Plugin Host Postgres Host Port
    description: "Host port published for the Plugin Host PostgreSQL instance."
    type: text
    required: true
    default: 6434

  - name: PLUGINHOST_SERVER_OUTERPORT
    label: Plugin Host Server Host Port
    description: "Host port published for the Plugin Host server."
    type: text
    required: true
    default: 5240

  - name: PLUGINHOST_CLIENT_OUTERPORT
    label: Plugin Host Client Host Port
    description: "Host port published for the Plugin Host client."
    type: text
    required: true
    default: 5000

  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  - name: PLUGINHOST_POSTGRES_USER
    label: Plugin Host PostgreSQL User
    description: "Username for the Plugin Host PostgreSQL database."
    type: text
    required: true
    default: postgres

  - name: PLUGINHOST_POSTGRES_DATABASE
    label: Plugin Host PostgreSQL Database
    description: "Database name for the Plugin Host PostgreSQL instance."
    type: text
    required: true
    default: pluginhostdb

  - name: PLUGINHOST_POSTGRES_PASSWORD
    label: Plugin Host PostgreSQL Password
    description: "Password for the Plugin Host PostgreSQL user."
    type: password
    required: true
    default: postgres

  # ---------------------------------------------------------------------------
  # Plugin Host Server
  # ---------------------------------------------------------------------------
  - name: PLUGINHOST_SERVER_HOSTNAME
    label: Plugin Host Server Public Hostname
    description: "Hostname (and port) under which the Plugin Host server is reachable from the browser."
    type: text
    required: true
    default: localhost:5240

  - name: PLUGINHOST_SERVER_GETPLUGIN_SECRET
    label: Get-Plugin Secret
    description: "Secret key used to sign plugin retrieval tokens."
    type: password
    required: true
    default: your-very-secure-and-long-key123!

  # ---------------------------------------------------------------------------
  # SignalR
  # ---------------------------------------------------------------------------
  - name: PLUGINHOST_SIGNALR_HUB_PATH
    label: SignalR Hub Path
    description: "Path of the SignalR hub endpoint on the Plugin Host server."
    type: text
    required: true
    default: /hub

  - name: PLUGINHOST_SIGNALR_PLUGIN_EVENT
    label: SignalR Plugin Event Name
    description: "SignalR event name emitted on plugin changes."
    type: text
    required: true
    default: PluginChange

  - name: PLUGINHOST_SIGNALR_OPERATION_ADD_PLUGIN
    label: SignalR Add Plugin Operation
    description: "SignalR operation name for adding a plugin."
    type: text
    required: true
    default: Add

  - name: PLUGINHOST_SIGNALR_OPERATION_DELETE_PLUGIN
    label: SignalR Delete Plugin Operation
    description: "SignalR operation name for deleting a plugin."
    type: text
    required: true
    default: Delete

  - name: PLUGINHOST_SIGNALR_OPERATION_PATCH_PLUGINS
    label: SignalR Patch Plugins Operation
    description: "SignalR operation name for patching plugins."
    type: text
    required: true
    default: Patch

  # ---------------------------------------------------------------------------
  # Keycloak
  # ---------------------------------------------------------------------------
  - name: KEYCLOAK_SERVER_HOSTNAME
    label: Keycloak Server Hostname
    description: "Hostname (and optional port) of the Keycloak server."
    type: text
    required: true
    default: localhost:9345

  - name: KEYCLOAK_REALM
    label: Keycloak Realm
    description: "Keycloak realm used for authentication."
    type: text
    required: true
    default: gaeco

  - name: KEYCLOAK_SERVER_CLIENT_ID
    label: Keycloak Backend Client ID
    description: "Keycloak client ID of the confidential backend client."
    type: text
    required: true
    default: plugin-host-server

  - name: KEYCLOAK_SERVER_CLIENT_SECRET
    label: Keycloak Backend Client Secret
    description: "Keycloak client secret of the confidential backend client."
    type: password
    required: true
    default: PMDD9BxtquYUohAV33SzcZc1ZijLnKhk

  - name: KEYCLOAK_CLIENT_CLIENT_ID
    label: Keycloak Frontend Client ID
    description: "Keycloak public client ID the frontend logs in with. Client roles are read from resource_access under this id."
    type: text
    required: true
    default: plugin-host-client
