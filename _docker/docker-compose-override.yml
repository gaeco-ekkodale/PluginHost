# docker compose -f docker-compose.yml -f docker‐compose-override.yml up
name: pluginhost-service
services:
  pluginhost-postgres:
    ports:
      - "${PLUGINHOST_POSTGRES_OUTERPORT}:5432"

  pluginhost-server:
    ports:
      - "${PLUGINHOST_SERVER_OUTERPORT}:80"
    build:
      context: ../Server
      dockerfile: Api/Dockerfile
      secrets:
        - nugetconfig
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Keycloak__Host: http://keycloak-server:8080
      PluginJwt__Issuer: http://${PLUGINHOST_SERVER_HOSTNAME}

  pluginhost-client:
    ports:
      - ${PLUGINHOST_CLIENT_OUTERPORT}:80
    environment:
      - VITE_HOST_API_URL=http://${PLUGINHOST_SERVER_HOSTNAME}
      - VITE_KEYCLOAK_URL=http://${KEYCLOAK_SERVER_HOSTNAME}
    build:
      context: ../Client
      dockerfile: _docker/Dockerfile

secrets:
  nugetconfig:
    file: ../../_docker/docker-compose-files/nuget.config
